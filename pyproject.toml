[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jebin-lib"
version = "0.1.0"
description = "Personal utility library with HuggingFace dataset client and scene detection tools"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jebin"}
]

dependencies = [
    "huggingface_hub",
    "requests",
    "custom-logger @ git+https://github.com/jebin2/custom_logger.git"
]

[project.optional-dependencies]
scene_detect = [
    "opencv-python",
    "transformers",
    "torch",
    "Pillow",
]
all = [
    "jebin-lib[scene_detect]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jebin_lib*"]
